name: los-tres

# Every published port binds to loopback only (TD-8). Secrets come from .env,
# generated by `npm run env:init`; they are never written in this file.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      SITE_NAME: ${SITE_NAME:?run npm run env:init}
      DATABASE_URL: postgres://${DB_USER:-lostres}:${DB_PASSWORD:?run npm run env:init}@db:5432/${DB_NAME:-lostres}
      # Unset means off: a server that forgets it shows no demo shops.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      # Owner identity for the legal pages; blank keeps every other page working.
      OWNER_NAME: ${OWNER_NAME:-}
      OWNER_NIF: ${OWNER_NIF:-}
      OWNER_ADDRESS: ${OWNER_ADDRESS:-}
      OWNER_REGISTRY: ${OWNER_REGISTRY:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # Admin sign-in (US-2.1). Blank keeps every public page working; the admin
      # area then shows Unavailable.
      AUTH_SECRET: ${AUTH_SECRET:-}
      SITE_URL: ${SITE_URL:-}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-lostres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run npm run env:init}
      POSTGRES_DB: ${DB_NAME:-lostres}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.20.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgres://${DB_USER:-lostres}:${DB_PASSWORD:?run npm run env:init}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?run npm run env:init}
      DISABLE_TELEMETRY: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db-data:
