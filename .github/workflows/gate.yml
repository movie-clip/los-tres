# Runs `npm run gate` (lint, typecheck, unit + integration, Compose stack, e2e)
# on every pull request: the same command and the same browser tests as the local gate.
# Make the `gate` check required on `main` (branch ruleset) so a failing gate blocks the merge.
#
# The .env is generated fresh by `npm run env:init` on the runner: random
# secrets, SEED_DEMO_DATA=true, blank owner identity (the legal-page specs
# then expect 500). No repository secret is used or needed.
name: gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: npm run env:init

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Gate
        run: npm run gate

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Upload Playwright output on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-test-results-${{ matrix.attempt }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
